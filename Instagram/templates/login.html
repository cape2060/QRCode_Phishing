<body>
    <div class="main-container">
        <div class="content-wrapper">
        <div class="phone-section">
            <div class="phone-container">
                <img src="/images/landing-2x.png" alt="Instagram phones" class="phones-img">
            </div>
        </div>            <div class="form-section">
                <div class="form-container">

                    <div class="form-wrapper">
                        <form action="/login" method="POST">
                            <div class="input-wrapper">
                                <label class="input-label">
                                    <input 
                                        type="text" 
                                        name="username" 
                                        class="input-box" 
                                        placeholder="Phone number, username, or email"
                                        required

                                        autocorrect="off"
                                    >
                                </label>
                            </div>
                            <div class="input-wrapper">
                                <label class="input-label">
                                    <input 
                                        type="password" 
                                        name="password" 
                                        class="input-box" 
                                        placeholder="Password"
                                        required
                                    >
                                </label>
                            </div>
                            <button type="submit" class="login-button">Log in</button>
                        </form>
                    </div>
                    
                    <div class="or-divider">
                        <div class="divider-line"></div>
                        <div class="divider-text">OR</div>
                        <div class="divider-line"></div>
                    </div>
                    
                    <div class="fb-login-wrapper">
                        <button class="fb-login-btn">

                                </svg>
                            </span>
                            <span class="fb-text">Log in with Facebook</span>
                        </button>
                    </div>
                    
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                
                <div class="signup-container">
                    <p class="signup-text">Don't have an account? <a href="#" class="signup-link">Sign up</a></p>
                </div>
                
                <div class="app-download">
                    <p class="app-text">Get the app.</p>
                    <div class="store-buttons">
                        <a href="https://apps.apple.com/app/instagram/id389801252" target="_blank" rel="noopener noreferrer">

                        </a>
